<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenly Home | Bible Quiz</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c2935;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:20px 16px 22px}header{text-align:center;margin-bottom:15px}.church{color:#536579;font-size:.85rem}h1{font-size:clamp(1.65rem,5vw,2.35rem);margin:5px 0}header p{margin:6px 0;color:#536579;font-size:.95rem}.progress{height:7px;background:#dce3ea;border-radius:10px;overflow:hidden;margin:14px 0 6px}.progress span{display:block;height:100%;width:0;background:#24618c;transition:width .2s}.count{font-size:.85rem;color:#536579;text-align:right}.panel{background:#fff;border:1px solid #dce3ea;border-radius:16px;padding:clamp(18px,4vw,28px);box-shadow:0 2px 9px #1b35500a;min-height:230px}h2{font-size:clamp(1.16rem,3.8vw,1.5rem);line-height:1.35;margin:0 0 22px}.choices{display:flex;gap:12px}.choices button,.next,.restart{font:inherit;font-weight:700;border-radius:10px;min-height:50px;cursor:pointer}.choices button{flex:1;border:1px solid #8b9db0;background:#fff;color:#1c2935}.choices button[aria-pressed="true"]{background:#143e62;border-color:#143e62;color:#fff}.feedback{background:#edf3f8;border-radius:10px;padding:13px 15px;margin-top:17px;line-height:1.5}.feedback strong{display:block;margin-bottom:4px}.feedback[hidden],.next[hidden],.restart[hidden]{display:none}.next,.restart{width:100%;background:#143e62;color:white;border:0;margin-top:14px}.restart{background:#fff;color:#143e62;border:1px solid #8b9db0}.complete{text-align:center}.complete h2{margin-bottom:8px}footer{color:#536579;text-align:center;font-size:.78rem;margin-top:15px}button:focus-visible{outline:3px solid #e7a83e;outline-offset:3px}@media(max-width:400px){main{padding:12px}header{margin-bottom:10px}.panel{padding:16px}.choices button{min-height:52px}}
</style>
</head>
<body><main>
<header><div class="church">Star of Bethlehem Lutheran Church</div><h1>Heavenly Home</h1><p>How much do you know about heaven?</p><div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="count" id="count" aria-live="polite">Question 1 of 7</div></header>
<section class="panel" id="panel" aria-live="polite"></section>
<footer>No sign-in. No submissions. Answers stay on this device while the page is open.</footer>
</main>
<script>
const questions=[
['Everyone who dies goes to a better place.',false,'John 3:16–18 — Eternal life is received through faith in Christ, not simply through death.'],
['We will recognize people in heaven.',true,'Matthew 8:11 — Abraham, Isaac, and Jacob retain their identities. This supports recognition, though not every detail is revealed.'],
['Heaven will be boring because all we do is sing.',false,'Revelation 22:3–5 — God’s servants worship, serve, and reign with him.'],
['We will have physical bodies in eternity.',true,'Philippians 3:20–21 — Christ will transform our lowly bodies to be like his glorious body.'],
['The Bible promises that our pets will be in heaven.',false,'Isaiah 11:6–9 — Scripture uses animal imagery to describe peace, but does not promise the resurrection of individual pets.'],
['There will be no sadness, pain, or death in heaven.',true,'Revelation 21:4 — God promises the complete removal of these consequences of sin.'],
['We know exactly what the new heaven and new earth will look like.',false,'1 Corinthians 2:9 — God’s promises are certain, but many details remain unrevealed.']
];
let current=0,selected=null;const panel=document.getElementById('panel'),count=document.getElementById('count'),bar=document.getElementById('bar');
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function render(){panel.replaceChildren();bar.style.width=`${Math.min(current,questions.length)/questions.length*100}%`;
if(current===questions.length){bar.style.width='100%';count.textContent='Finished!';const wrap=el('div',undefined,'complete');wrap.append(el('h2','You finished the quiz!'),el('p','Thank you for exploring what Scripture says about our heavenly home.'));const restart=el('button','Start over','restart');restart.onclick=()=>{current=0;selected=null;render()};wrap.append(restart);panel.append(wrap);return}
count.textContent=`Question ${current+1} of ${questions.length}`;const [q,correct,explanation]=questions[current];panel.append(el('h2',q));const choices=el('div',undefined,'choices');for(const value of [true,false]){const button=el('button',value?'True':'False');button.type='button';button.setAttribute('aria-pressed',String(selected===value));button.onclick=()=>{selected=value;render()};choices.append(button)}panel.append(choices);
if(selected!==null){const feedback=el('div',undefined,'feedback');feedback.append(el('strong',`${selected===correct?'Correct!':'Not quite.'} The answer is ${correct?'True':'False'}.`),el('div',explanation));panel.append(feedback);const next=el('button',current===questions.length-1?'Finish quiz':'Next question →','next');next.type='button';next.onclick=()=>{current++;selected=null;render()};panel.append(next)}
}
render();
</script></body></html>
